[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "1.0.0"
description = "A Dual-Phase, Recoverable Policy Proxy for Model Context Protocol"
authors = [{ name = "AI Agent Security Research" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
mcp-sentinel = "mcp_sentinel.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
